type AuthPayload {
  token: String!
  user: User!
}

extend type Mutation {
  loginStudent(
    nis: Int!
    password: String!
  ): AuthPayload!

  loginTeacher(
    identifier: String!
    password: String!
  ): AuthPayload!

  loginAdmin(
    identifier: String!
    password: String!
  ): AuthPayload!
}